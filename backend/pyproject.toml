# Tool configuration only. The app is not a distributable package; runtime
# dependencies live in requirements*.txt so Docker can cache them separately.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ASYNC",    # async antipatterns
    "BLE",      # blind excepts (deliberate ones must be noqa'd with a reason)
]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]
"tests/*" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires a real Postgres+pgvector; auto-skips when unreachable",
    "slow: downloads or runs the real embedding model (excluded from `make test`)",
    "live: calls the real Claude API (excluded from `make test`)",
]
